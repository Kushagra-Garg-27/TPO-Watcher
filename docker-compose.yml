services:
  watcher:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: tpo-watcher
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - watcher_data:/app/data
    environment:
      # Persistent paths in mounted volume
      - DB_PATH=/app/data/watcher.sqlite
      - STATE_FILE=/app/data/playwright_state.json
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2
    container_name: tpo-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - watcher
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  watcher_data:
  caddy_data:
  caddy_config:
