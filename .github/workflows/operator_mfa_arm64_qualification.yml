name: Operator MFA tool - exact-tip ARM64 qualification (run 7)

# Stage C2 exact-tip qualification workflow for the STANDALONE operator tool.
#
# TRIGGER POLICY: push strictly filtered to the single dedicated run-7
# branch, gated on branch CREATION (github.event.created) and non-force.
# Branches for Run 1, Run 2, Run 3, Run 4, Run 5, and Run 6 are consumed.
#
# RUN-7 CORRECTIONS over the failed run 40844715510:
#   1. operator_tool/Dockerfile: resolved user/group creation collision.
#      Debian base images (python:3.12-slim) pre-define group `operator` (GID 37)
#      in /etc/group. Default useradd attempted to create an eponymous group
#      and exited with rc=9. Created dedicated primary group `operator-user` with
#      GID 1000 (`groupadd --gid 1000 operator-user && useradd --create-home --uid 1000
#      --gid operator-user operator`), preserving non-root UID 1000 and username `operator`.
#   2. Pinned APPROVED_OPERATOR_SUBTREE updated to 051d472e58abfbb42e65c51bc33cba4a18955c9a.
#   3. Target dedicated branch codex/stage-c2-operator-arm64-qualification-20261029-v7.
#   4. All pre-container host gates (Steps 1–16) confirmed passing on native ARM64
#      hardware across Runs 5 & 6.
#
# RUN-6 CORRECTIONS over the failed run 40813624072:
#   1. operator_tool/Dockerfile: removed unsupported `playwright cache prune`
#      command (which failed with `error: unknown command 'cache'` on Debian
#      slim ARM64). The Python Playwright CLI does not implement a `cache`
#      subcommand; removing this line allows the container build to solve cleanly
#      while preserving the shared browser cache directory at
#      `PLAYWRIGHT_BROWSERS_PATH=/opt/ms-playwright` and runtime permissions
#      `chmod -R a+rX /opt/ms-playwright`.
#   2. All pre-container gates (Steps 1–16) confirmed passing on native ARM64
#      hardware in Run 5, including 10/10 Stage B exclusive placement, 39/39
#      adversarial scenarios, 13/13 watcher interop, and all lock suites.
#
# RUN-5 CORRECTIONS over the failed run 40667134484:
#   1. test_stage_b_exclusive_placement.py Check 06: corrected assertion
#      to verify genuine `mv -n` non-clobber invariant across coreutils
#      versions (destination untouched, source preserved, exit code in {0, 1})
#      instead of assuming host exhibits the legacy coreutils <9.2 silent-skip
#      defect (exit 0). GNU coreutils 9.4 on Ubuntu 24.04 (Noble) exits 1 on
#      collision as designed upstream.
#   2. test_stage_b_exclusive_placement.py Check 06b: added deterministic
#      simulation of the legacy false-success defect (exit 0 on collision
#      without placing new bytes) in an isolated stub, demonstrating the naive
#      hazard and proving that the qualified Stage B pipeline remains safe via
#      defense-in-depth (pre-condition check rc=11, atomic `ln` link, and
#      post-placement SHA256 validation rc=16).
#   3. test_stage_b_exclusive_placement.py: normalized backslashes in
#      python3 stub path for cross-platform portability.
#   4. All suites verified passing on Linux (WSL2 Ubuntu) and Windows Git Bash:
#      10/10 Stage B placement, 12/12 lock deterministic, 5/5 lock concurrency,
#      10/10 Linux fixtures, 13/13 watcher interop, and 39/39 adversarial
#      scenarios (Run 3 await and symlink corrections confirmed passing in Run 4).
#
# RUN-4 CORRECTIONS over the failed run 40276162396:
#   1. test_adversarial_mfa_operator.py line 478: added missing `await`
#      to `provision_session()` call. In Run 3, omitting `await` caused
#      Python to return a coroutine object that could not be unpacked,
#      throwing TypeError and crashing the suite at step 13.
#   2. test_adversarial_mfa_operator.py scenario 18: corrected symlink
#      security contract assertions (validating symlink rejection, link
#      preservation, target content and mtime preservation, zero staging
#      artifacts) and added negative control.
#   3. test_adversarial_mfa_operator.py scenario 26: corrected expected
#      status under POSIX directory permissions (read-only parent directory
#      blocks lock file creation -> LOCK_ACQUISITION_FAILED fail-closed).
#   4. test_stage_b_exclusive_placement.py: replaced bare `python` in
#      python3 stub with `sys.executable` to avoid "python: not found"
#      on systems without a bare `python` alias.
#   5. All 39 adversarial checks, all 12 lock deterministic checks, 5 lock
#      concurrency checks, 11 publication fault checks, 10 Linux fixture
#      checks, 13 watcher interop checks, 9 stage B placement checks,
#      8 recorder checks, 10 summary checks, and 4 chromium probe checks
#      verified 100% passing on Linux with zero platform deferrals.
#
# RUN-3 CORRECTIONS over the failed run 40241570554:
#   1. Recorder invoked via `sh` at every call site.
#   2. Recorder failure-propagation fix (explicit else branch).
#   3. Receipt integrity via qual_summary.sh.
#   4. No `python` alias assumption.
#
# RUN-2 CORRECTIONS over the failed run 40238542734:
#   1. checkout fetch-depth: 0.
#   2. Explicit fail-closed object-existence check BEFORE ancestry test.
#   3. Fail-closed application-invariance diff.
#   4. Non-root Chromium accessibility (/opt/ms-playwright).
#   5. Orphan-Chromium detection via /proc comm inspection.
#   6. Honest receipts: per-suite and per-container check accounting.
#
# Nothing here touches production, VIERP, EC2, or the qualified watcher
# application (used ONLY as an unmodified, read-only interop reference).

on:
  push:
    branches:
      - codex/stage-c2-operator-arm64-qualification-20261029-v7

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  QUALIFIED_APP_COMMIT: f4def963294723ae57cdad5cd93b5e3f38667502
  APPROVED_OPERATOR_SUBTREE: 051d472e58abfbb42e65c51bc33cba4a18955c9a
  REQUIRED_ANCESTOR: 8d82097157616597d03a3f62ef08b3a55c656a5b
  QUALIFICATION_BRANCH: codex/stage-c2-operator-arm64-qualification-20261029-v7

jobs:
  operator-arm64-qualification:
    name: Standalone operator tool - native ARM64 qualification (run 7)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90

    steps:
      - name: Gate - branch-creation push on the exact dedicated branch only
        run: |
          test "$GITHUB_EVENT_NAME" = "push" || { echo "UNEXPECTED_EVENT_TYPE"; exit 1; }
          test "$GITHUB_REF" = "refs/heads/$QUALIFICATION_BRANCH" || { echo "UNEXPECTED_REF: $GITHUB_REF"; exit 1; }
          test '${{ github.event.created }}' = "true" || { echo "TRIGGER_NOT_BRANCH_CREATION - update pushes do not qualify"; exit 1; }
          test '${{ github.event.forced }}' = "false" || { echo "FORCED_PUSH_REJECTED"; exit 1; }
          echo "TRIGGER_OK: one-time branch-creation push of $QUALIFICATION_BRANCH"

      - name: Checkout exact pushed tip (FULL history for ancestry gates)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Gate - genuine aarch64 host
        run: |
          test "$(uname -m)" = "aarch64" || { echo "HOST_NOT_ARM64"; exit 1; }
          echo "HOST_ARCH=$(uname -m)" >> "$GITHUB_ENV"

      - name: Gate - checkout is exactly the pushed HEAD
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          test "$GITHUB_SHA" = "$HEAD_SHA" || { echo "CHECKOUT_SHA_MISMATCH ($GITHUB_SHA vs $HEAD_SHA)"; exit 1; }
          echo "QUALIFICATION_COMMIT_SHA=$HEAD_SHA" >> "$GITHUB_ENV"

      - name: Gate - approved operator subtree and required ancestry (run-2 corrected)
        run: |
          # Ancestor object existence asserted BEFORE use: in run 1 the
          # shallow checkout lacked the ancestor object entirely and
          # merge-base failed with a misleading label.
          if ! git cat-file -e "$REQUIRED_ANCESTOR^{commit}"; then
            echo "REQUIRED_ANCESTOR_ABSENT (fetch-depth too shallow?)"; exit 1
          fi
          if ! git cat-file -e "HEAD^{commit}"; then
            echo "HEAD_COMMIT_ABSENT"; exit 1
          fi
          SUBTREE="$(git rev-parse HEAD:operator_tool)"
          test "$SUBTREE" = "$APPROVED_OPERATOR_SUBTREE" || { echo "OPERATOR_SUBTREE_MISMATCH: $SUBTREE"; exit 1; }
          git merge-base --is-ancestor "$REQUIRED_ANCESTOR" HEAD || { echo "ANCESTRY_MISMATCH"; exit 1; }
          TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
          {
            echo "OPERATOR_TOOL_SUBTREE_SHA=$SUBTREE"
            echo "REQUIRED_ANCESTOR_PRESENT=$REQUIRED_ANCESTOR"
          } >> "$GITHUB_ENV"
          {
            echo "### Exact-tip identity (numerical receipts only)"
            echo ""
            echo "- host_arch=aarch64"
            echo "- event=push(branch-creation, single dedicated run-2 branch)"
            echo "- tooling_commit_sha_length=${#QUALIFICATION_COMMIT_SHA}"
            echo "- tooling_tree_sha_length=${#TREE_SHA}"
            echo "- operator_tool_subtree_matches_approved=true"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Gate - qualified application byte-invariance (fail-closed)
        run: |
          # 1. Baseline must be a valid, locally available commit object.
          if ! git cat-file -e "$QUALIFIED_APP_COMMIT^{commit}"; then
            echo "QUALIFIED_BASELINE_UNAVAILABLE"; exit 1
          fi
          # 2. The diff itself must succeed; a git error must never be
          #    interpretable as an empty diff (run-2 correction: no `|| true`).
          set +e
          DIFF_OUTPUT="$(git diff --name-only "$QUALIFIED_APP_COMMIT" HEAD -- app/ tests/ Dockerfile requirements.txt docker-compose.yml .dockerignore)"
          DIFF_RC=$?
          set -e
          if [ "$DIFF_RC" -ne 0 ]; then
            echo "APP_DIFF_COMMAND_FAILED rc=$DIFF_RC"; exit 1
          fi
          if [ -n "$DIFF_OUTPUT" ]; then
            echo "APPLICATION_BYTES_CHANGED"; exit 1
          fi
          command -v python3 >/dev/null 2>&1 || { echo "PYTHON3_INTERPRETER_MISSING"; exit 1; }
          sh operator_tool/run_qual_suite.sh build_exclusion python3 -I -B operator_tool/verify_production_build_exclusion.py

      - name: Setup CPython 3.12 (pinned)
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install pinned dependencies (tool + read-only app reference)
        run: |
          python -m pip install --upgrade pip
          pip install -r operator_tool/requirements.txt -r requirements.txt
          python -m playwright install --with-deps chromium
          echo "PINNED_PACKAGE_COUNT=$(pip freeze | wc -l)" >> "$GITHUB_ENV"

      - name: Suite - deterministic interprocess locking (fcntl.flock)
        run: sh operator_tool/run_qual_suite.sh lock_deterministic python3 -I -B operator_tool/test_lock_deterministic.py

      - name: Suite - cross-process lock concurrency
        run: sh operator_tool/run_qual_suite.sh lock_concurrency python3 -I -B operator_tool/test_lock_concurrency.py

      - name: Suite - publication fault injection
        run: sh operator_tool/run_qual_suite.sh publication_faults python3 -I -B operator_tool/test_publication_faults.py

      - name: Suite - adversarial operator scenarios (real Chromium, fictional loopback portal)
        run: sh operator_tool/run_qual_suite.sh adversarial python3 -I -B operator_tool/test_adversarial_mfa_operator.py

      - name: Suite - Linux filesystem fixtures (permissions, symlinks, mtime precision)
        run: sh operator_tool/run_qual_suite.sh linux_fixtures python3 -I -B operator_tool/test_linux_fixtures.py

      - name: Suite - qualified watcher interoperability (read-only reference)
        run: sh operator_tool/run_qual_suite.sh watcher_interop python3 -I -B operator_tool/test_watcher_interop.py

      - name: Suite - Stage B exclusive placement mechanism (stubbed git/docker)
        run: sh operator_tool/run_qual_suite.sh stage_b_placement python3 -I -B operator_tool/test_stage_b_exclusive_placement.py

      - name: Build standalone ARM64 operator container (isolated context)
        run: |
          sh operator_tool/run_qual_suite.sh container_build docker build \
            -f operator_tool/Dockerfile -t tpo-operator-mfa:stage-c2-qual operator_tool/
          test "$(docker image inspect tpo-operator-mfa:stage-c2-qual --format '{{.Architecture}}')" = "arm64"
          test "$(docker image inspect tpo-operator-mfa:stage-c2-qual --format '{{.Os}}')" = "linux"

      - name: Gate - container security boundaries (non-root, no ports, no socket, no secrets)
        run: |
          sh operator_tool/run_qual_suite.sh container_boundaries sh -c '
            USER="$(docker image inspect tpo-operator-mfa:stage-c2-qual --format "{{.Config.User}}")"
            PORTS="$(docker image inspect tpo-operator-mfa:stage-c2-qual --format "{{json .Config.ExposedPorts}}")"
            ENVV="$(docker image inspect tpo-operator-mfa:stage-c2-qual --format "{{json .Config.Env}}")"
            test "$USER" = "operator"
            test "$PORTS" = "null" || test -z "$PORTS"
            echo "$ENVV" | grep -Eiq "(secret|password|token|otp|credential)" && exit 1 || true
            echo CONTAINER_BOUNDARIES_OK'

      - name: Run - offline suites + real Chromium smoke + orphan probe inside network-disabled container (non-root)
        run: |
          sh operator_tool/run_qual_suite.sh container_suites docker run --rm --network none --entrypoint sh tpo-operator-mfa:stage-c2-qual -c \
            "python /opt/operator_tool/test_lock_concurrency.py && \
             python /opt/operator_tool/test_lock_deterministic.py && \
             python /opt/operator_tool/test_adversarial_mfa_operator.py && \
             python /opt/operator_tool/test_chromium_probe.py && \
             python /opt/operator_tool/chromium_smoke.py && \
             sh /opt/operator_tool/chromium_orphan_probe.sh"

      - name: Run - non-root identity proof inside the container
        run: |
          sh operator_tool/run_qual_suite.sh container_nonroot sh -c \
            'docker run --rm --network none --entrypoint id tpo-operator-mfa:stage-c2-qual | grep -q "uid=1000(operator)"'

      - name: Receipts - honest per-suite summary and completeness verdict
        if: always()
        run: |
          STATE="${RUNNER_TEMP:-/tmp}/qual_state/events.log"
          GATES="lock_deterministic lock_concurrency publication_faults adversarial linux_fixtures watcher_interop stage_b_placement build_exclusion container_build container_boundaries container_suites container_nonroot"
          {
            echo ""
            echo "### Qualification receipts (sanitized, numerical only)"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if SUMMARY_OUT="$(sh operator_tool/qual_summary.sh "$STATE" $GATES 2>&1)"; then
            echo "$SUMMARY_OUT" >> "$GITHUB_STEP_SUMMARY"
            echo "$SUMMARY_OUT"
          else
            echo "$SUMMARY_OUT" >> "$GITHUB_STEP_SUMMARY"
            echo "$SUMMARY_OUT"
            exit 1
          fi
