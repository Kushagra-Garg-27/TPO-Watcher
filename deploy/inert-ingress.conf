worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 64; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 16k;
    client_header_timeout 5s;
    client_body_timeout 5s;
    send_timeout 5s;
    keepalive_timeout 5s;
    upstream inert_application { server inert-rehearsal:8000; }
    server {
        listen 8080;
        server_name _;
        # Reject forward-proxy request targets and tunneling methods.
        if ($request ~* "^[A-Z]+ [a-z][a-z0-9+.-]*://") { return 400; }
        if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) { return 405; }
        location / {
            proxy_pass http://inert_application;
            proxy_http_version 1.1;
            proxy_set_header Host inert-rehearsal;
            proxy_set_header Connection close;
            proxy_set_header Upgrade "";
            proxy_set_header Proxy "";
            proxy_set_header Proxy-Authorization "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_intercept_errors off;
            proxy_redirect off;
            proxy_next_upstream off;
            add_header X-TPO-Rehearsal-Ingress fixed-upstream always;
        }
    }
}
